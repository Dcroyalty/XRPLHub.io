name: Lending tracker (hourly)

# Calls https://www.xrplhub.io/api/cron/lending-tracker once an hour (Vercel Hobby crons can only run daily).
# The route is public and stores at most one snapshot per hour, so no secret is needed here.
#
# GitHub pauses scheduled workflows in a public repo after 60 days without a commit. If that happens the
# XRPLHub watchdog raises a RED "lending-tracker" finding (healthchecks.io emails you): open the Actions tab,
# pick this workflow and press "Enable workflow". Can also be run by hand (workflow_dispatch).

on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Run the hourly lending job
        run: |
          code=$(curl -sS -o body.json -w '%{http_code}' --max-time 90 https://www.xrplhub.io/api/cron/lending-tracker)
          cat body.json; echo
          echo "HTTP $code"
          test "$code" = "200"
